name: Deploy DogeHouse ordering
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dogehouse-order-function
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Check deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN under repository Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Deploy authenticated ordering function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy submit-order --project-ref lftpzfnzokjqgeteitul --no-verify-jwt --use-api
