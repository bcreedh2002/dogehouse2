name: Deploy DogeHouse ordering
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Explicit staging project ref (production is blocked on this branch)'
        required: true
        type: string
      confirm_project_ref:
        description: 'Type the same project ref again'
        required: true
        type: string
      prerequisites_verified:
        description: 'Staging hardening SQL applied LAST; SITE_URL and test-only provider secrets verified'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: dogehouse-order-function
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit staging target
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          PREREQUISITES_VERIFIED: ${{ inputs.prerequisites_verified }}
        run: |
          set -eu
          test "$PREREQUISITES_VERIFIED" = "true"
          test "$PROJECT_REF" = "$CONFIRM_PROJECT_REF"
          test "$PROJECT_REF" = "jpncaudfzxqjzddyrkss"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Check deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN under repository Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Deploy authenticated ordering function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          supabase functions deploy submit-order --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          supabase functions deploy owner-order --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
